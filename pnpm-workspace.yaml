# Dev-only advisories that the direct dependency has not picked up yet. Drop an
# entry once `pnpm why <name>` shows the parent resolving a patched version.
overrides:
  immutable@>=5.0.0 <5.1.8: ^5.1.8
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2

# Supply-chain hardening: a release has to be a week old before it installs, so
# a compromised publish is usually caught and yanked first. Keep in sync with
# the Dependabot cooldown in .github/dependabot.yml.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@perawallet/walletconnect'

strictPeerDependencies: true
