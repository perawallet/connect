name: "✅ pr check"

on:
  pull_request:
    branches:
      - main

# Least-privilege: this workflow only needs to read the repo.
permissions:
  contents: read

# Cancel in-progress runs for the same PR when new commits are pushed.
concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: 🧪 lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".tool-versions"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run eslint

      - name: Test
        run: pnpm test

  secret-scan:
    name: 🔐 secret scan
    runs-on: ubuntu-latest
    env:
      # The gitleaks CLI is free and Apache-2.0; only the gitleaks-action
      # wrapper needs a paid licence for organisations, so install the binary
      # directly. Pinned by version and verified against the release checksum.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Setup repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          # Whole history: a secret is just as published if it was committed,
          # reverted, and only the revert landed in this PR.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan history for secrets
        run: ./gitleaks git --no-banner --redact .
