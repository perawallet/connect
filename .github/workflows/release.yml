name: "🚀 release"

on:
  push:
    tags:
      - "v*"

# Least-privilege default. The publish job opts into id-token below.
permissions:
  contents: read

jobs:
  release:
    name: 🚀 release
    runs-on: ubuntu-latest
    permissions:
      # OIDC token for npm trusted-publisher provenance.
      id-token: write
      contents: read
    env:
      # The gitleaks CLI is free and Apache-2.0; only the gitleaks-action
      # wrapper needs a paid licence for organisations, so install the binary
      # directly. Pinned by version and verified against the release checksum.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Setup repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".tool-versions"
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & test
        run: pnpm run eslint && pnpm test

      - name: Install gitleaks
        # Outside the checkout: `pnpm publish` packs the working directory, so a
        # binary downloaded there ships to every consumer of the package.
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan history for secrets
        run: ${{ runner.temp }}/gitleaks git --no-banner --redact .

      - name: Build app
        run: pnpm run build:release

      # The last gate before npm. Source-level scanning can miss a secret that
      # only a build step inlines, and a published tarball cannot be recalled.
      - name: Scan built bundle for secrets
        run: ${{ runner.temp }}/gitleaks dir --no-banner --redact dist

      - name: Audit dependencies
        run: pnpm audit --prod --audit-level=moderate

      - name: Resolve release channel
        id: channel
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) does not match package.json ($PKG_VERSION)"
            exit 1
          fi
          if [[ "$TAG_VERSION" == *-* ]]; then
            echo "dist_tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: 🚀 publish
        run: pnpm publish --access public --tag ${{ steps.channel.outputs.dist_tag }} --provenance --no-git-checks

      # TODO: enable GitHub Releases once the action is pinned to a commit SHA.
      # Requires bumping the job permission `contents: read` -> `contents: write`.
      # - name: Create GitHub Release
      #   uses: softprops/action-gh-release@<PIN-TO-SHA> # v2
      #   with:
      #     generate_release_notes: true
      #     prerelease: ${{ contains(github.ref_name, '-') }}
