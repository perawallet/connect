name: Release / Publish

on:
  push:
    tags:
      - "v*"

# Least-privilege default. The publish job opts into id-token below.
permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # OIDC token for npm trusted-publisher provenance.
      id-token: write
      contents: read
    env:
      # The gitleaks CLI is free and Apache-2.0; only the gitleaks-action
      # wrapper needs a paid licence for organisations, so install the binary
      # directly. Pinned by version and verified against the release checksum.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".tool-versions"
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same gates as pre-merge, so a tag pushed past a red main cannot publish.
      - name: Lint
        run: pnpm lint && pnpm lint:types && pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:coverage

      - name: Install gitleaks
        # Outside the checkout: `pnpm publish` packs the working directory, so a
        # binary downloaded there would ship to every consumer of the package.
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan history for secrets
        run: ${{ runner.temp }}/gitleaks git --no-banner --redact .

      - name: Build
        run: pnpm build

      # The last gate before npm. Source-level scanning can miss a secret that
      # only a build step inlines, and a published tarball cannot be recalled.
      - name: Scan built bundle for secrets
        run: ${{ runner.temp }}/gitleaks dir --no-banner --redact dist

      - name: Check package
        run: pnpm check:package

      - name: Audit dependencies
        run: pnpm audit --prod --audit-level=moderate

      - name: Resolve release channel
        id: channel
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) does not match package.json ($PKG_VERSION)"
            exit 1
          fi
          if [[ "$TAG_VERSION" == *-* ]]; then
            echo "dist_tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        run: pnpm publish --access public --tag ${{ steps.channel.outputs.dist_tag }} --provenance --no-git-checks
